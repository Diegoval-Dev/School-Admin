<form method="get" class="filtros">
  <label>Ciclo
    <select name="ciclo">
      {% for opcion in ciclos %}
        <option value="{{ opcion.pk }}" {% if ciclo and opcion.pk == ciclo.pk %}selected{% endif %}>{{ opcion.anio }}</option>
      {% endfor %}
    </select>
  </label>
  <label>Grado
    <select name="grado">
      {% for valor, texto in grados %}
        <option value="{{ valor }}" {% if valor == grado %}selected{% endif %}>{{ texto }}</option>
      {% endfor %}
    </select>
  </label>
  <label>Jornada
    <select name="jornada">
      {% for valor, texto in jornadas %}
        <option value="{{ valor }}" {% if valor == jornada %}selected{% endif %}>{{ texto }}</option>
      {% endfor %}
    </select>
  </label>
  <button type="submit">Mostrar</button>
</form>
